<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kadastro360 — Yönetici</title>
<style>
:root{--bg:#f1f5f7;--panel:#fff;--line:#dce4e8;--text:#17212b;--muted:#667681;--green:#168a68;--red:#b73d3d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}a,button{font:inherit}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 12px;border-radius:8px;text-decoration:none;cursor:pointer;font-weight:700;font-size:12px}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{color:var(--red)}
main{max-width:1180px;margin:20px auto;padding:0 16px 40px}.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.card h2{font-size:13px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);text-transform:uppercase;color:var(--muted);letter-spacing:.04em}.body{padding:14px}.field{margin-bottom:10px}.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:4px}.field input,.field select{width:100%;height:38px;border:1px solid #cbd6dc;border-radius:8px;padding:0 9px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.notice{font-size:12px;line-height:1.5;padding:10px;border-radius:8px;margin-bottom:10px;background:#eef8f4;color:#0d6a50}.notice.error{background:#fff1f1;color:#8d2c2c}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px 9px;border-bottom:1px solid var(--line);font-size:11px;text-align:left;vertical-align:middle}th{color:var(--muted);font-size:10px;text-transform:uppercase;background:#fbfcfc}.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#edf2f4;font-weight:800;font-size:9px}.badge.ok{background:#e8f6f1;color:#0d6a50}.badge.off{background:#fff0f0;color:#8d2c2c}.inline{display:flex;gap:6px;align-items:center}.inline input{width:75px;height:30px;border:1px solid #cbd6dc;border-radius:6px;padding:0 6px}.mini{border:1px solid var(--line);background:#fff;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:10px;font-weight:750}.empty{padding:30px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:850px){.grid{grid-template-columns:1fr}header{align-items:flex-start}.actions{justify-content:flex-end}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><h1>Kadastro360 Yönetici</h1><div class="sub">Kullanıcı, kota ve deneme süresi yönetimi</div></div><div class="actions"><a class="btn" href="/">Uygulamaya dön</a><a class="btn danger" href="/logout">Çıkış</a></div></header>
<main>
<div class="grid">
<section class="card"><h2>Yeni kullanıcı</h2><div class="body">
<div id="message"></div>
<form id="create-form">
<div class="field"><label>Kullanıcı adı</label><input id="username" required minlength="3"></div>
<div class="field"><label>Parola</label><input id="password" type="password" required minlength="6"></div>
<div class="row"><div class="field"><label>Rol</label><select id="role"><option value="user">Kullanıcı</option><option value="admin">Yönetici</option></select></div><div class="field"><label>Günlük sorgu kotası</label><input id="quota" type="number" min="1" max="10000" value="20"></div></div>
<div class="field"><label>Deneme bitişi (isteğe bağlı)</label><input id="trial" type="datetime-local"></div>
<button class="btn primary" style="width:100%" type="submit">Kullanıcı oluştur</button>
</form></div></section>
<section class="card"><h2>Kullanıcılar</h2><div class="table-wrap"><table><thead><tr><th>Kullanıcı</th><th>Rol</th><th>Durum</th><th>Bugün</th><th>Kota</th><th>Deneme bitişi</th><th>Son giriş</th><th>İşlem</th></tr></thead><tbody id="users"><tr><td colspan="8"><div class="empty">Yükleniyor…</div></td></tr></tbody></table></div></section>
</div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(path,options={}){const r=await fetch('/api'+path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d;}
function msg(text,error=false){$('message').innerHTML=text?`<div class="notice${error?' error':''}">${esc(text)}</div>`:'';}
function fmt(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('tr-TR');}
async function load(){try{const d=await api('/admin/users');const rows=d.users||[];$('users').innerHTML=rows.map(u=>`<tr data-user="${esc(u.username)}"><td><strong>${esc(u.username)}</strong></td><td>${esc(u.role)}</td><td><span class="badge ${u.active?'ok':'off'}">${u.active?'Aktif':'Pasif'}</span></td><td>${Number(u.usedToday||0)}</td><td><div class="inline"><input class="quota" type="number" min="1" max="10000" value="${Number(u.dailyQuota||20)}"></div></td><td>${fmt(u.trialEndsAt)}${u.trialExpired?' · doldu':''}</td><td>${fmt(u.lastLoginAt)}</td><td><div class="inline"><button class="mini save">Kaydet</button><button class="mini toggle">${u.active?'Pasifleştir':'Aktifleştir'}</button></div></td></tr>`).join('')||'<tr><td colspan="8"><div class="empty">Kullanıcı yok.</div></td></tr>';
 document.querySelectorAll('tr[data-user]').forEach(row=>{const username=row.dataset.user;row.querySelector('.save').onclick=()=>update(username,{dailyQuota:Number(row.querySelector('.quota').value)});row.querySelector('.toggle').onclick=()=>{const active=row.querySelector('.toggle').textContent==='Aktifleştir';update(username,{active});};});
}catch(e){msg(e.message,true);}}
async function update(username,body){try{await api('/admin/users/'+encodeURIComponent(username),{method:'PATCH',body:JSON.stringify(body)});msg('Kullanıcı güncellendi.');load();}catch(e){msg(e.message,true);}}
$('create-form').addEventListener('submit',async e=>{e.preventDefault();try{const trial=$('trial').value?new Date($('trial').value).toISOString():null;await api('/admin/users',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value,role:$('role').value,dailyQuota:Number($('quota').value),trialEndsAt:trial})});e.target.reset();$('quota').value=20;msg('Kullanıcı oluşturuldu.');load();}catch(err){msg(err.message,true);}});
load();
</script>
</body>
</html>
